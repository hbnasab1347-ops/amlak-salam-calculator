name: Stage 12 validation
on:
  push:
    branches:
      - stage-12-contact-management
    paths:
      - '.github/workflows/stage-12-validation.yml'
      - 'app/**'
      - 'main.js'
      - 'preload.js'
      - 'package.json'
      - 'desktop-home.html'
      - 'tests/**'
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run syntax and database tests
        run: npm test
      - name: Build Windows installer
        run: npm run dist
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amlak-Salam-Stage12-Test-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 90
