name: Build Amlak Salam APK - Separate Install

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'index.html'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت فایل‌ها
        uses: actions/checkout@v4

      - name: نصب جاوا
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب ابزارهای اندروید
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: بازکردن بسته و تنظیم شناسه مستقل
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpacked
          unzip -o "./AmlakSalam_Icon_Package.zip" -d unpacked
          echo '--- ANDROID SOURCE FILES ---'
          find unpacked -type f \( -name '*Activity*' -o -name 'AndroidManifest.xml' \) -print

          echo '--- MAIN ACTIVITY SOURCE ---'
          sed -n '1,260p' "$(find unpacked -name MainActivity.java -print -quit)"
          echo '--- MANIFEST SOURCE ---'
          sed -n '1,180p' "$(find unpacked -name AndroidManifest.xml -print -quit)"

          SETTINGS="$(find unpacked -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: فایل تنظیمات پروژه اندروید پیدا نشد."
            exit 1
          fi
          ANDROID_DIR="$(dirname "$SETTINGS")"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          MAIN_ACTIVITY="$ANDROID_DIR/app/src/main/java/ir/amlaaksalam/calculator/MainActivity.java"
          cat > "$MAIN_ACTIVITY" <<'JAVA'
          package ir.amlaaksalam.calculator;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.webkit.WebView;
          import android.webkit.WebChromeClient;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.JavascriptInterface;

          public class MainActivity extends Activity {
              private WebView webView;

              private class ShareBridge {
                  @JavascriptInterface
                  public void shareText(final String text) {
                      runOnUiThread(() -> {
                          Intent sendIntent = new Intent(Intent.ACTION_SEND);
                          sendIntent.setType("text/plain");
                          sendIntent.putExtra(Intent.EXTRA_TEXT, text);
                          Intent chooser = Intent.createChooser(sendIntent, "ارسال گزارش محاسبه‌گر املاک سلام");
                          startActivity(chooser);
                      });
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.addJavascriptInterface(new ShareBridge(), "AndroidShare");
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          JAVA
          echo "Native Android share bridge installed in MainActivity."

          python3 - "$ANDROID_DIR" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          candidates = [p for p in root.rglob("build.gradle") if "build" not in p.parts]
          candidates += [p for p in root.rglob("build.gradle.kts") if "build" not in p.parts]
          app_files = [p for p in candidates if p.parent.name == "app"]
          if len(app_files) != 1:
              raise SystemExit(f"Expected one app Gradle file, found: {[str(p) for p in app_files]}")
          path = app_files[0]
          text = path.read_text(encoding="utf-8")
          new_id = "ir.amlaaksalam.calculator.android3.new"
          if path.name.endswith(".kts"):
              line = f'        applicationId = "{new_id}"'
              pattern = r'(?m)^\s*applicationId\s*=\s*"[^"]*"\s*$'
          else:
              line = f'        applicationId "{new_id}"'
              pattern = r'(?m)^\s*applicationId\s+["\'][^"\']+["\']\s*$'
          if re.search(pattern, text):
              text = re.sub(pattern, line, text, count=1)
          else:
              match = re.search(r'(?m)^([ \t]*)defaultConfig\s*\{', text)
              if not match:
                  raise SystemExit("defaultConfig block not found; refusing unsafe edit.")
              pos = match.end()
              text = text[:pos] + "\n" + line + text[pos:]
          path.write_text(text, encoding="utf-8")
          print(f"Configured separate Android applicationId in {path}")
          PY

      - name: قراردادن آخرین نسخه محاسبه‌گر در برنامه اندروید
        shell: bash
        run: |
          set -euo pipefail
          ASSETS_DIR="$ANDROID_DIR/app/src/main/assets"
          mkdir -p "$ASSETS_DIR"
          cp ./index.html "$ASSETS_DIR/index.html"
          grep -q "yearFmt" "$ASSETS_DIR/index.html"
          grep -q "سال ساخت و سن بنا" "$ASSETS_DIR/index.html"
          echo "نسخه به‌روز index.html در بسته اندروید قرار گرفت."

      - name: ساخت فایل نصب اندروید
        run: gradle -p "$ANDROID_DIR" assembleDebug

      - name: آماده‌سازی فایل نصب مستقل
        uses: actions/upload-artifact@v4
        with:
          name: Amlak-Salam-Android-Separate
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
