
name: Build Amlak Salam APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌ها
        uses: actions/checkout@v4

      - name: نصب جاوا
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی ابزارهای اندروید
        uses: android-actions/setup-android@v3

      - name: نصب بسته‌های اندروید
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: بازکردن بسته برنامه
        shell: bash
        run: |
          set -e
          mkdir -p unpacked
          ZIP_FILE="./amlak-salam-icon-update.zip"
          test -f "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d unpacked

          ANDROID_DIR="$(find unpacked -name settings.gradle -print -quit)"
          if [ -z "$ANDROID_DIR" ]; then
            ANDROID_DIR="$(find unpacked -name settings.gradle.kts -print -quit)"
          fi

          test -n "$ANDROID_DIR"
          ANDROID_DIR="$(dirname "$ANDROID_DIR")"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: ساخت فایل نصب اندروید
        run: gradle -p "$ANDROID_DIR" assembleDebug

      - name: آماده‌سازی فایل نصب
        uses: actions/upload-artifact@v4
        with:
          name: Amlak-Salam-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
