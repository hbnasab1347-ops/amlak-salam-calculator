<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self';script-src 'self'"><title>مدیریت فیلدها | املاک سلام</title><link rel="stylesheet" href="custom-fields.css"></head><body><main class="wrap"><header><div><b>املاک سلام</b><h1>مدیریت فیلدها و امکانات</h1><p>فیلدهای اختصاصی را بسازید و مشخص کنید در چه پرونده‌هایی نمایش داده شوند.</p></div><button id="close">بازگشت</button></header><section class="layout"><form id="editor"><h2 id="formTitle">افزودن فیلد جدید</h2><input type="hidden" id="id"><label>عنوان نمایشی<input id="label" maxlength="80" required placeholder="مثلاً عرض گذر"></label><label>شناسه انگلیسی (بدون فاصله)<input id="key" maxlength="50" required pattern="[a-z][a-z0-9_]+" placeholder="مثلاً passage_width"></label><div class="two"><label>نوع پرونده<select id="entity"><option value="property">ملک</option><option value="demand">تقاضا</option></select></label><label>نوع ورودی<select id="type"><option value="text">متن کوتاه</option><option value="number">عدد</option><option value="textarea">متن بلند</option><option value="select">فهرست انتخاب</option><option value="checkbox">بله / خیر</option><option value="multi">چند انتخابی / امکانات</option></select></label></div><label>گزینه‌ها (هر گزینه در یک خط)<textarea id="options" rows="4" placeholder="برای فهرست انتخابی یا چند انتخابی"></textarea></label><label>نوع معامله<select id="transactions" multiple><option value="sale">فروش</option><option value="rent_lease">رهن و اجاره</option><option value="participation">مشارکت در ساخت</option><option value="presale">پیش‌فروش</option><option value="purchase">خرید</option><option value="pre_purchase">پیش‌خرید</option></select></label><label>نوع ملک<select id="properties" multiple><option value="apartment">آپارتمان</option><option value="land">زمین</option><option value="villa">ویلا</option><option value="commercial">تجاری</option><option value="office">اداری</option><option value="industrial">صنعتی</option><option value="old_building">کلنگی</option><option value="other">سایر</option></select></label><label>کاربری<select id="usages" multiple><option value="residential">مسکونی</option><option value="commercial">تجاری</option><option value="office">اداری</option><option value="industrial">صنعتی</option><option value="agricultural">کشاورزی</option><option value="mixed">مختلط</option><option value="other">سایر</option></select></label><div class="two"><label>ترتیب نمایش<input id="order" type="number" value="100"></label><label class="check"><input id="required" type="checkbox"> اجباری باشد</label></div><div class="actions"><button class="save" type="submit">ذخیره فیلد</button><button type="button" id="reset">پاک‌کردن فرم</button></div><small>برای حفظ اطلاعات پرونده‌های قبلی، حذف دائمی نداریم؛ فیلد را غیرفعال کنید.</small></form><section class="list"><div class="list-head"><h2>فیلدهای تعریف‌شده</h2><label class="check"><input id="inactive" type="checkbox"> نمایش غیرفعال‌ها</label></div><div id="items">در حال بارگذاری…</div></section></section><div id="toast"></div></main><script src="custom-fields.js"></script></body></html>
