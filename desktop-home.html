<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f2ed">
<title>میزکار املاک سلام</title>
<style>
:root{--gold:#b8954d;--gold2:#d6bd83;--ink:#202124;--muted:#737373;--paper:#f4f2ed;--panel:#fff;--line:#e4e0d7;--nav:#242526;--shadow:0 10px 28px #25252512}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}button{font:inherit;cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:70px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:relative;z-index:2}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:bold}.logo{width:38px;height:38px;border:2px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font-weight:bold}.top small{font-size:11px;color:var(--muted);font-weight:normal;display:block;margin-top:3px}.top-actions{display:flex;gap:8px}.launchbtn{border:1px solid #b8954d;background:#b8954d;color:#fff;border-radius:9px;padding:8px 13px;font-weight:bold}.launchbtn:hover{background:#a17d39}.softbtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;color:var(--ink)}.workspace{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;padding:18px 20px 14px;min-height:0}.scene{border-radius:17px;min-height:520px;position:relative;overflow:hidden;background:linear-gradient(130deg,#d8d5cd,#a9a69c);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#17191b55,#17191b18),radial-gradient(ellipse at 75% 20%,#fff8,transparent 35%)}.scene-inner{position:relative;color:white;text-align:center;padding:24px;text-shadow:0 2px 12px #0008}.scene-inner h1{font-size:clamp(25px,4vw,46px);margin:0 0 8px}.scene-inner p{margin:0;color:#fff;font-size:14px}.scene-tools{position:absolute;left:14px;bottom:14px;display:flex;gap:8px}.scene-tools button{background:#fffE;border:1px solid #ffffff80;border-radius:9px;padding:8px 11px;color:#252525}.side{background:var(--nav);color:#fff;border-radius:16px;padding:14px 11px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:520px}.side-head{font-size:14px;color:var(--gold2);padding:4px 9px 12px;border-bottom:1px solid #ffffff20;margin-bottom:8px}.navlist{overflow:auto;display:grid;gap:4px}.navitem{width:100%;display:flex;align-items:center;gap:10px;text-align:right;border:1px solid transparent;background:transparent;color:#f5f5f5;padding:9px 10px;border-radius:9px;font-size:13px}.navitem:hover,.navitem.active{background:#ffffff14;border-color:#b8954d88}.ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#b8954d24;color:var(--gold2);font-size:14px;flex:none}.bottom{height:58px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}.openapps{display:flex;align-items:center;gap:7px;min-width:0;overflow:auto}.appchip{white-space:nowrap;border:1px solid var(--line);background:var(--paper);padding:6px 10px;border-radius:8px;font-size:11px}.status{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--muted);white-space:nowrap}.remind{position:relative;border:0;background:transparent;font-size:20px;color:var(--ink)}.count{position:absolute;top:-4px;right:-7px;background:#d93636;color:white;border-radius:20px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}.modalback{display:none;position:fixed;inset:0;background:#1119;z-index:5;align-items:center;justify-content:center;padding:16px}.modal{background:var(--panel);color:var(--ink);width:min(520px,100%);border-radius:15px;padding:20px;box-shadow:0 20px 60px #0003}.modal h2{font-size:18px;margin:0 0 12px}.modal p{font-size:13px;line-height:2;color:var(--muted)}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.goldbtn{background:var(--gold);color:#fff;border:0;border-radius:8px;padding:9px 14px}.closebtn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 14px}.fileinput{display:none}.toast{position:fixed;bottom:75px;left:20px;background:#242526;color:white;padding:10px 14px;border-radius:9px;font-size:12px;display:none;z-index:7}
@media(max-width:850px){.workspace{grid-template-columns:1fr;padding:12px}.side{min-height:0;order:-1}.navlist{grid-template-columns:repeat(2,minmax(0,1fr));max-height:250px}.scene{min-height:360px}.top{padding:0 12px}.brand{font-size:18px}.bottom{padding:0 10px}.status{gap:8px}}
@media(max-width:520px){.top{height:60px}.top-actions .softbtn:first-child{display:none}.workspace{gap:10px}.scene{min-height:270px}.navlist{grid-template-columns:1fr 1fr}.navitem{font-size:11px;padding:8px 6px}.bottom{height:auto;min-height:56px;flex-wrap:wrap;padding:7px 10px}.status{width:100%;justify-content:space-between}.openapps{width:100%}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="logo" id="logoMark">س</div><div>املاک سلام<small>سامانه جامع مدیریت مشاور املاک | نسخه آزمایشی</small></div></div>
 <div class="top-actions"><button class="launchbtn" id="calcBtn">∑ اجرای محاسبه‌گر مستقل</button><button class="softbtn" id="logoBtn">تغییر لوگو</button><button class="softbtn" id="settingsBtn">تنظیمات میزکار</button></div>
</header>
<main class="workspace">
 <section class="scene" id="scene">
  <div class="scene-inner"><h1>به املاک سلام خوش آمدید</h1><p>مدیریت هوشمند فایل‌ها، مشتریان و معاملات ملکی</p></div>
  <div class="scene-tools"><button id="bgBtn">تغییر پس‌زمینه</button><button id="resetBg">بازگشت به تصویر پیش‌فرض</button></div>
 </section>
 <aside class="side">
  <div class="side-head">میزکار و بخش‌های مدیریتی</div>
  <nav class="navlist" id="navlist"></nav>
 </aside>
</main>
<footer class="bottom">
 <div class="openapps" id="openapps"><span class="appchip">میزکار املاک سلام</span></div>
 <div class="status"><span id="date"></span><span id="clock"></span><button class="remind" id="remindBtn" aria-label="یادآوری‌ها">♧<span class="count" id="unread">۲</span></button><span>وضعیت: آماده</span></div>
</footer>
</div>
<input class="fileinput" type="file" id="bgFile" accept="image/*"><input class="fileinput" type="file" id="logoFile" accept="image/*">
<div class="modalback" id="modalback"><section class="modal"><h2 id="modalTitle">بخش انتخاب‌شده</h2><p id="modalText">این بخش در مرحله بعدی توسعه خواهد یافت.</p><div class="modalfoot"><button class="closebtn" id="closeModal">بستن</button><button class="goldbtn" id="markRead" style="display:none">علامت‌گذاری به‌عنوان خوانده‌شده</button></div></section></div>
<div class="toast" id="toast"></div>
<script>
const modules=['ثبت ملک','ثبت تقاضا','مدیریت ارباب‌رجوع','بایگانی ملک','بایگانی تقاضا','پیش‌نویس‌ها','سطل زباله','آگهی‌شده‌ها','قراردادها','مدیریت سازمان و شعب','محاسبه‌گرها','پیگیری و یادآوری','گزارش‌ها','حسابداری','تنظیمات و شخصی‌سازی'];
const symbols=['🏠','📝','👥','🗂️','📥','💾','🗑️','📢','📄','🏢','🧮','🔔','📊','💰','⚙️'];
const nav=document.getElementById('navlist'),modal=document.getElementById('modalback');
modules.forEach((name,i)=>{const b=document.createElement('button');b.className='navitem';b.innerHTML='<span class="ico">'+symbols[i]+'</span><span>'+(i+1)+'. '+name+'</span>';b.addEventListener('click',()=>openModule(name));nav.appendChild(b)});
function openModule(name){if(name==='محاسبه‌گرها'){openCalculator();return;}document.getElementById('modalTitle').textContent=name;document.getElementById('modalText').textContent='بخش «'+name+'» در نقشه اجرایی نرم‌افزار جامع املاک سلام قرار دارد. فرم‌ها، دسترسی‌ها و ارتباط با سایر بخش‌ها در مراحل بعدی به‌صورت واقعی پیاده‌سازی می‌شوند.';document.getElementById('markRead').style.display='none';modal.style.display='flex';}
document.getElementById('closeModal').onclick=()=>modal.style.display='none';modal.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none'});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2400)}
document.getElementById('bgBtn').onclick=()=>document.getElementById('bgFile').click();
document.getElementById('bgFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);document.getElementById('scene').style.background='linear-gradient(#17191b22,#17191b22),url("'+u+'") center/cover';toast('پس‌زمینه میزکار تغییر کرد.')};
document.getElementById('resetBg').onclick=()=>{document.getElementById('scene').style.background='linear-gradient(130deg,#d8d5cd,#a9a69c)';toast('پس‌زمینه پیش‌فرض بازگردانده شد.')};
document.getElementById('logoBtn').onclick=()=>document.getElementById('logoFile').click();
document.getElementById('logoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),el=document.getElementById('logoMark');el.textContent='';el.style.background='center/cover url("'+u+'")';toast('لوگوی میزکار تغییر کرد.')};
document.getElementById('settingsBtn').onclick=()=>openModule('تنظیمات و شخصی‌سازی');
function openCalculator(){if(window.AmlakDesktop&&typeof window.AmlakDesktop.openCalculator==='function'){window.AmlakDesktop.openCalculator();}else{toast('برای اجرای محاسبه‌گر، نسخه دسکتاپ نصب‌شده را اجرا کنید.')}}
document.getElementById('calcBtn').onclick=openCalculator;
document.getElementById('remindBtn').onclick=()=>{document.getElementById('modalTitle').textContent='یادآوری‌ها';document.getElementById('modalText').textContent='۲ یادآوری خوانده‌نشده دارید. این بخش در نسخه عملیاتی به فهرست پیگیری‌ها متصل می‌شود.';document.getElementById('markRead').style.display='inline-block';modal.style.display='flex'};
document.getElementById('markRead').onclick=()=>{document.getElementById('unread').style.display='none';modal.style.display='none';toast('یادآوری‌ها خوانده‌شده علامت خوردند.')};
function tick(){const now=new Date();document.getElementById('clock').textContent=now.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}).format(now)}
tick();setInterval(tick,30000);
</script>
</body></html>
