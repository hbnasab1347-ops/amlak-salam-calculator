<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بایگانی و جست‌وجوی هوشمند | املاک سلام</title>
<style>
:root{--gold:#b8954d;--ink:#242526;--muted:#747474;--paper:#f4f2ed;--line:#e4e0d7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.head h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:7px}.tabs{display:flex;gap:8px;margin:20px 0 14px}.tab,button{font:inherit;cursor:pointer}.tab{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 18px}.tab.active,.primary{background:var(--gold);border-color:var(--gold);color:white}.filters{background:white;border:1px solid var(--line);border-radius:13px;padding:14px;display:grid;grid-template-columns:2fr 1fr 1.3fr auto;gap:9px}.filters input,.filters select{min-width:0;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:white}.primary{border:0;border-radius:8px;padding:10px 16px}.list{display:grid;gap:10px;margin-top:16px}.item{background:white;border:1px solid var(--line);border-radius:12px;padding:14px}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:start}.code{font-weight:bold}.meta{font-size:12px;color:var(--muted);line-height:2;margin-top:7px}.custom{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip{background:#f3f0e8;border-radius:20px;padding:5px 9px;font-size:11px}.actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.actions button{border:1px solid var(--line);background:white;border-radius:8px;padding:7px 11px;font-size:12px}.actions .match{border-color:var(--gold);color:#82652f}.empty{padding:35px;text-align:center;color:var(--muted);background:white;border-radius:12px}.matches{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.matchrow{padding:9px 0;border-bottom:1px solid #eee;font-size:12px;line-height:1.9}.score{font-weight:bold;color:#80632d}.note{font-size:11px;color:var(--muted);margin-top:14px}@media(max-width:720px){.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}.head h1{font-size:18px}}
</style></head><body><main class="wrap">
<header class="head"><div><h1>بایگانی و جست‌وجوی هوشمند</h1><div class="sub">جست‌وجو در اطلاعات ثبت‌شده و فیلدهای سفارشی؛ بدون نمایش یادداشت‌ها و قیمت‌های محرمانه</div></div><button onclick="window.close()">بستن</button></header>
<nav class="tabs"><button class="tab active" data-type="property">بایگانی ملک</button><button class="tab" data-type="demand">بایگانی تقاضا</button></nav>
<section class="filters"><input id="query" placeholder="جست‌وجو در کد، شهر، نوع ملک و مقادیر فیلدهای سفارشی"><select id="field"><option value="">همه فیلدهای سفارشی</option></select><input id="fieldValue" placeholder="مقدار فیلد انتخابی"><button class="primary" id="search">جست‌وجو</button></section>
<div id="results" class="list"><div class="empty">در حال دریافت پرونده‌ها...</div></div>
<div class="note">تطبیق‌ها پیشنهاد اولیه هستند و پیش از تماس یا معامله باید توسط مشاور بررسی شوند. اطلاعات تماس، یادداشت محرمانه و قیمت خط قرمز در این صفحه نمایش داده نمی‌شوند.</div>
</main><script src="archive.js"></script></body></html>
